<!doctype html>
<!-- Generated from tools/index.template.html by tools/build-site.mjs. Edit those, not this file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>João Oliveira · Software Engineer</title>
<meta name="description" content="João Oliveira, software engineer in Porto.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script>document.documentElement.classList.add('js'); try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<header class="band" id="top">
  
  <div class="wrap top">
    <a class="mark" href="#top">{{name}}</a>
    <nav>
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#education">Education</a>
      <a href="#contact">Contact</a>
      <a id="cv-top" href="{{cv}}">CV</a>
    </nav>
    <button class="theme" id="theme" type="button" aria-label="Switch light or dark mode"><svg class="sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </div>
  <div class="wrap hero">
    <div class="hero-main">
      <p class="meta"><span>{{location}}</span><span class="clock" id="clock"></span></p>
      <h1>{{name}}</h1>
      <p class="title">{{title}}</p>
      <p class="tagline">{{tagline}}</p>
    </div>
    <aside class="now">{{now}}</aside>
  </div>
</header>

<main>
  <section class="wrap section" id="about">
    <h2 class="reveal">About</h2>
    <div>
      <div class="prose reveal">{{about}}</div>
      <p class="skills reveal">{{skills}}</p>
    </div>
  </section>

  <section class="wrap section" id="experience">
    <h2 class="reveal">Experience</h2>
    <ol class="rows" id="jobs">{{jobs}}</ol>
  </section>

  <section class="wrap section" id="education">
    <h2 class="reveal">Education</h2>
    <ol class="rows">{{schools}}</ol>
  </section>
</main>

<footer class="band band-end" id="contact">
  
  <div class="wrap contact">
    <div class="contact-intro reveal">
      <h2>Say hello</h2>
      <p class="contact-text">{{contact}}</p>
    </div>
    <div class="contact-list reveal">
      <a class="email" href="mailto:{{email}}">{{email}}</a>
      <p class="links">{{links}}</p>
    </div>
    <p class="foot reveal">© <span id="year"></span> {{name}}, Porto</p>
  </div>
</footer>

<script type="module" src="assets/site.js"></script>
</body>
</html>
