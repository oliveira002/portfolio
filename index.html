<!doctype html>
<html lang="en">
<head>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<header class="bar">
  <div class="wrap bar-inner">
    <a class="mark" href="#top"><span data-field="name"></span> <span class="mark-role" data-field="title"></span></a>
    <nav>
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#education">Education</a>
      <a href="#contact">Contact</a>
    </nav>
    <button class="theme" id="theme" type="button" aria-label="Switch light or dark mode"><svg class="sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    <a class="cv-link" id="cv-top" href="cv/cv.pdf">CV</a>
  </div>
</header>

<main id="top">
  <section class="wrap hero">
    <div class="hero-main">
      <p class="where"><span class="dot"></span><span data-field="location"></span></p>
      <h1 data-field="name"></h1>
      <p class="role" data-field="title"></p>
      <p class="tagline" data-field="tagline"></p>
      <div class="links">
        <a class="pill primary" href="#contact">Get in touch</a>
      </div>
    </div>
    <aside class="now" id="now"></aside>
  </section>

  <section class="wrap">
    <dl class="stats" id="highlights"></dl>
  </section>

  <div class="ticker" aria-label="Skills"><ul id="ticker"></ul></div>

  <section class="wrap section" id="about">
    <h2>About</h2>
    <div class="prose" id="about-text"></div>
  </section>

  <section class="wrap section" id="experience">
    <h2>Experience</h2>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section class="wrap section" id="education">
    <h2>Education</h2>
    <div class="schools" id="schools"></div>
  </section>

  <section class="wrap contact" id="contact">
    <h2 class="contact-title">Get in <em>touch</em>.</h2>
    <p class="contact-text" data-field="contact"></p>
    <a class="email" id="email"></a>
    <div class="links" id="contact-links"></div>
  </section>
</main>

<footer class="wrap foot">
  <span>© <span id="year"></span> <span data-field="name"></span></span>
  <a href="#top">Back to top ↑</a>
</footer>

<script type="module" src="assets/site.js"></script>

</html>
